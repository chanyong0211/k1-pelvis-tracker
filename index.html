/* Layout: sticky save bar, left section rail on wide screens, one reading column of working sections; teal = target/plan, amber = today's planner baseline */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --sunken:#e8ecea; --ink:#17201e; --muted:#58645f; --line:#d3dad7;
  --accent:#0d6b77; --accent-soft:#d7ecee; --base:#a4630a; --base-soft:#f5e7d2;
  --good:#2c7a47; --warn:#a4630a; --bad:#b23a3a;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#192120; --sunken:#212b29; --ink:#e3eae7; --muted:#9aa9a4; --line:#2e3a37;
  --accent:#4fb4c0; --accent-soft:#16363a; --base:#e2a24e; --base-soft:#3a2c17;
  --good:#5cbb7c; --warn:#e2a24e; --bad:#e46f6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#192120; --sunken:#212b29; --ink:#e3eae7; --muted:#9aa9a4; --line:#2e3a37;
  --accent:#4fb4c0; --accent-soft:#16363a; --base:#e2a24e; --base-soft:#3a2c17;
  --good:#5cbb7c; --warn:#e2a24e; --bad:#e46f6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-inline:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar-title{font-weight:700;font-size:15px;margin-right:auto;min-width:0}
.bar-title small{font-weight:400;color:var(--muted);margin-left:8px;font-family:var(--f-mono);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.dirty{background:var(--base-soft);color:var(--base)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.small{padding:2px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.notice{max-width:1180px;margin:10px auto 0;padding-inline:16px}
.notice > div{background:var(--base-soft);color:var(--ink);border-radius:6px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 80px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px}
nav.rail{position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:14px}
nav.rail a{color:var(--muted);text-decoration:none;padding:4px 10px;border-left:2px solid var(--line)}
nav.rail a:hover{color:var(--ink);border-left-color:var(--accent)}
nav.rail .k{font-family:var(--f-mono);font-size:12px;margin-right:6px;color:var(--accent)}
main{min-width:0;display:flex;flex-direction:column;gap:56px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)} nav.rail{display:none}}
section{min-width:0;scroll-margin-top:70px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
h1{font-size:30px;line-height:1.25;margin:4px 0 10px;text-wrap:balance;font-weight:700}
h2{font-size:21px;margin:2px 0 6px;text-wrap:balance;font-weight:700}
h3{font-size:16px;margin:0;font-weight:700}
.lede{color:var(--muted);max-width:68ch;margin:0 0 18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
textarea.f,input.f{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;line-height:1.55;resize:none;overflow:hidden}
textarea.f:hover,input.f:hover{border-color:var(--muted)}
textarea.big{font-size:16px}
input.num{width:84px;text-align:right;font-family:var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface)}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:6px}
label.lab{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.rule{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--muted);margin-top:16px}
.rule b{color:var(--ink)}

/* metrics */
.metrics{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.m-row{display:grid;grid-template-columns:minmax(180px,1.1fr) minmax(0,1.6fr) 120px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.m-name{font-weight:500}
.m-src{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.m-bars{display:flex;flex-direction:column;gap:5px;min-width:0}
.m-bar{display:grid;grid-template-columns:44px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:12px}
.m-bar .track{height:10px;background:var(--sunken);border-radius:3px;overflow:hidden}
.m-bar .fill{height:100%;border-radius:3px}
.m-bar.b .fill{background:var(--base)} .m-bar.t .fill{background:var(--accent)}
.m-bar .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.m-bar.b .who{color:var(--base)} .m-bar.t .who{color:var(--accent)}
.m-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.up{background:var(--accent-soft);color:var(--accent)}
.chip.keep{background:var(--sunken);color:var(--muted)}
.chip.oos{background:var(--base-soft);color:var(--base)}
@media (max-width:640px){.m-row{grid-template-columns:minmax(0,1fr)} .m-side{flex-direction:row;align-items:center;justify-content:space-between}}

/* placement */
.place{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.place{grid-template-columns:minmax(0,1fr)}}
.svgbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto}
.svgbox svg{display:block;width:100%;min-width:420px;height:auto}
.legend{display:flex;flex-direction:column;gap:10px;font-size:14px}
.legend .sw{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:8px;border-radius:2px}
.slider{display:flex;flex-direction:column;gap:4px}
.slider input[type=range]{width:100%;accent-color:var(--accent)}

/* architecture */
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:18px}
.cand{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.cand:hover{border-color:var(--muted)}
.cand.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cand .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cand .lt{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.cand p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.base{background:var(--base-soft);color:var(--base)}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;overflow-x:auto}
.flow-row{display:flex;align-items:stretch;gap:0;min-width:760px}
.node{flex:1 1 0;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.45;background:var(--bg);min-width:0}

.node.learn{border-color:var(--accent);background:var(--accent-soft)}
.node.learn .r{color:var(--accent)}
.node.frozen{border-style:dashed}
.node.robot{background:var(--sunken)}
.arrow{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.fb{margin-top:10px;font-size:13px;color:var(--muted);min-width:760px;display:flex;gap:8px;align-items:center}
.fb .loop{flex:1;border-top:1px dashed var(--muted);height:0}
.side-in{margin-top:10px;min-width:760px;display:flex;gap:8px;font-size:13px}
.side-in .node{flex:0 1 330px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:640px){.pc{grid-template-columns:1fr}}
.pc h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:500}

/* io table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.io{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.io th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunken)}
table.io td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.io tr:last-child td{border-bottom:0}
table.io input{width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:4px}
table.io input:hover{border-color:var(--line)}
table.io input:focus{border-color:var(--accent);background:var(--bg)}
table.io td.dim input{font-family:var(--f-mono);text-align:right;width:60px}
.io-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px;gap:12px;flex-wrap:wrap}
.io-head:first-child{margin-top:0}
.sum{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px}
.card .no{font-family:var(--f-mono);color:var(--muted);font-size:13px;padding-top:2px}
.card .q{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.state{font-size:12px;padding:2px 9px;border-radius:99px;white-space:nowrap}
.state.open{background:var(--base-soft);color:var(--base)}
.state.set{background:var(--accent-soft);color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px;text-align:left;line-height:1.4}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .rec{font-size:11px;color:var(--accent);margin-left:6px;font-weight:500}
.why{font-size:13.5px;color:var(--muted);margin:0 0 8px;max-width:80ch}
.card .body{grid-column:2}

.phases{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:10px}
.ph{position:relative;padding:0 0 22px 24px}
.ph::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.ph.s-doing::before{border-color:var(--accent);background:var(--accent)}
.ph.s-done::before{border-color:var(--good);background:var(--good)}
.ph.s-hold::before{border-color:var(--base)}
.ph-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ph-top input.f{flex:1 1 260px;font-weight:700}
.status{border:0;border-radius:99px;padding:3px 12px;font-size:12px;cursor:pointer}
.status.s-plan{background:var(--sunken);color:var(--muted)}
.status.s-doing{background:var(--accent-soft);color:var(--accent)}
.status.s-done{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.status.s-hold{background:var(--base-soft);color:var(--base)}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.ph-grid{grid-template-columns:1fr}}
.ord{display:flex;gap:2px}
.src li{margin-bottom:4px;font-size:14px}
.src code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunken);padding:1px 6px;border-radius:4px;word-break:break-all}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal > div{background:var(--surface);border-radius:10px;padding:16px;width:min(760px,100%);max-height:85vh;display:flex;flex-direction:column;gap:10px}
.modal textarea{flex:1;min-height:50vh;font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg);resize:vertical}
@media (prefers-reduced-motion:no-preference){.btn,.opt,.cand{transition:border-color .12s,background-color .12s}}

function verdict(m){
  if(m.oos) return '<span class="chip oos">참고 — 정책 밖</span>';
  var b=+m.baseline,t=+m.target;
  if(b===t) return '<span class="chip keep">유지</span>';
  var better = m.better==="lower" ? t<b : t>b;
  if(!better) return '<span class="chip oos">지금보다 느슨함</span>';
  var r;
  if(m.better==="lower") r = t===0 ? "0 으로" : (b/t).toFixed(1)+"배 줄임";
  else r = b===0 ? "새로" : (t/b).toFixed(1)+"배 늘림";
  return '<span class="chip up">'+r+'</span>';
}
function mRow(m,i){

  return '<div class="m-row" data-mrow="'+i+'"><div><div class="m-name">'+esc(m.label)+'</div><div class="m-src">'+esc(m.src)+'</div></div>'+

/* ---------- events ---------- */
document.addEventListener("input",function(e){
  var el=e.target, path=el.getAttribute&&el.getAttribute("data-bind"); if(!path) return;
  var v=el.value;
  if(el.getAttribute("data-num")){var n=parseFloat(v); if(isNaN(n)) return; v=n;}
  setP(path,v);
  if(el.tagName==="TEXTAREA") grow(el.parentNode);
  var r=el.getAttribute("data-redraw");
  if(r==="metric"||r==="place"){
    var i=+path.split(".")[1]; redrawMetric(i);
    var id=S.metrics[i].id; if(id==="stop_pos"||id==="stop_yaw") drawPlace();
    if(r==="place"){var mi=document.getElementById("mt"+i); if(mi) mi.value=v;}
  }
  if(r==="io"){var sums=document.querySelectorAll("#io-body .sum"),keys=["inputs","outputs","critic"];
    keys.forEach(function(k,j){var s=0;S.io[k].forEach(function(x){var n=parseFloat(x.dim);if(!isNaN(n))s+=n;});sums[j].textContent="합 "+s;});}
  markDirty();
});
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-act]"); if(!b) return;
  var a=b.getAttribute("data-act"), i=+b.getAttribute("data-i"), k=b.getAttribute("data-k");
  if(a==="save"){save();return;}
  if(a==="gh-connect"){showConnect();return;}
  if(a==="gh-forget"){lsDel(GH_TOKEN_KEY);$("modal").innerHTML="";saveState="needtoken";renderBar();return;}
  if(a==="gh-save"){var tk=$("ghtok").value.trim(); if(!tk) return; $("ghmsg").textContent="확인 중…";
    fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo,{headers:{Authorization:"Bearer "+tk,Accept:"application/vnd.github+json"},cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(j&&j.permissions&&j.permissions.push){lsSet(GH_TOKEN_KEY,tk);$("modal").innerHTML="";saveState="ok";renderBar();}
      else $("ghmsg").textContent="이 토큰으로는 저장소에 쓸 수 없습니다. 저장소 선택과 Contents 쓰기 권한을 확인하세요.";
    },function(){$("ghmsg").textContent="GitHub 에 닿지 못했습니다. 연결을 확인하고 다시 누르세요.";});
    return;}
  if(a==="md"){showMd();return;}
  if(a==="backdrop"){if(e.target===b)$("modal").innerHTML="";return;}
  if(a==="close-md"){$("modal").innerHTML="";return;}
  if(a==="copy-md"){var t=$("mdtext");t.select();
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(function(){b.textContent="복사됨";},function(){b.textContent="선택됨 — Ctrl+C";});}
    else b.textContent="선택됨 — Ctrl+C";return;}
  if(a==="draft-load"){var base=S.meta.rev, sv=S.meta.savedAt; S=staleDraft.data; S.meta.rev=base; S.meta.savedAt=sv; staleDraft=null; renderAll(); markDirty(); return;}
  if(a==="draft-drop"){staleDraft=null; if(!dirty) lsDel(DRAFT_KEY); renderNotice(); return;}
  if(a==="arch"){var v=b.getAttribute("data-v"); S.arch.choice = S.arch.choice===v?null:v; rArch(); rIO(); grow(); markDirty(); return;}
  if(a==="choose"){var j=+b.getAttribute("data-v"); var d=S[k][i]; d.choice = d.choice===j?null:j; if(k==="decisions")rDec(); else rSim(); grow(); markDirty(); return;}
  if(a==="row-add"){S.io[k].push({name:"",dim:"",src:"",note:""}); rIO(); markDirty(); var ins=document.querySelectorAll("#io-body table")[["inputs","outputs","critic"].indexOf(k)].querySelectorAll("tr:last-child input"); if(ins[0]) ins[0].focus(); return;}
  if(a==="row-del"){S.io[k].splice(i,1); rIO(); markDirty(); return;}
  if(a==="status"){var p=S.phases[i]; var ix=STATUS.map(function(s){return s[0];}).indexOf(p.status); p.status=STATUS[(ix+1)%STATUS.length][0]; rPh(); grow(); markDirty(); return;}
  if(a==="ph-up"&&i>0){var t1=S.phases[i];S.phases[i]=S.phases[i-1];S.phases[i-1]=t1;rPh();grow();markDirty();return;}
  if(a==="ph-down"&&i<S.phases.length-1){var t2=S.phases[i];S.phases[i]=S.phases[i+1];S.phases[i+1]=t2;rPh();grow();markDirty();return;}
  if(a==="ph-del"){S.phases.splice(i,1);rPh();grow();markDirty();return;}
  if(a==="ph-add"){S.phases.push({id:"p"+Date.now(),title:"새 단계",detail:"",gate:"",status:"plan"});rPh();grow();markDirty();return;}
});
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault(); if(dirty) save();}});
window.addEventListener("resize",function(){grow();});

/* ---------- markdown ---------- */
function toMd(){
  var L=[], chosen=function(d){return d.choice===null||d.choice===undefined?"(정할 것, 권고: "+d.options[d.rec]+")":d.options[d.choice];};
  L.push("# "+S.meta.title,"", "판 "+S.meta.rev+" · "+fmtSaved(S.meta.savedAt),"");
  L.push("**무엇을** "+S.meta.goal,"","**왜** "+S.meta.why,"","**범위** "+S.meta.scope,"");
  L.push("## 지금과 목표","","| 지표 | 지금 | 목표 | 근거 |","|---|---|---|---|");
  S.metrics.forEach(function(m){L.push("| "+m.label+(m.oos?" (참고)":"")+" | "+m.baseline+" "+m.unit+" | "+m.target+" "+m.unit+" | "+m.src+" |");});
  var cur=S.arch.choice||S.arch.rec, c=S.candidates.filter(function(x){return x.id===cur;})[0];
  L.push("","## 구조","", "선택: "+(S.arch.choice?S.arch.choice+" "+c.name:"(정할 것, 권고: "+S.arch.rec+")"),"", "- "+c.summary,"- 좋은 점: "+c.pros,"- 걱정: "+c.cons);
  if(S.arch.note) L.push("- 메모: "+S.arch.note);
  [["inputs","actor 관측"],["outputs","행동"],["critic","critic 특권 관측"]].forEach(function(t){
    L.push("","### "+t[1],"","| 항목 | 차원 | 출처 | 비고 |","|---|---|---|---|");
    S.io[t[0]].forEach(function(r){L.push("| "+r.name+" | "+r.dim+" | "+r.src+" | "+r.note+" |");});
  });
  L.push("","## 결정","");
  S.decisions.forEach(function(d,i){L.push((i+1)+". "+d.q+" → "+chosen(d)+(d.note?"  \n   메모: "+d.note:""));});
  L.push("","## sim2real 체크리스트","");
  S.checklist.forEach(function(d,i){L.push((i+1)+". "+d.q+" → "+chosen(d)+(d.note?"  \n   메모: "+d.note:""));});
  L.push("","## 단계·관문","");
  S.phases.forEach(function(p,i){var st=STATUS.filter(function(s){return s[0]===p.status;})[0]||STATUS[0];L.push("- **P"+(i+1)+" "+p.title+"** ["+st[1]+"]  \n  "+p.detail+"  \n  관문: "+p.gate);});
  L.push("","## 메모","",S.notes);
  return L.join("\n");
}
function showMd(){
  $("modal").innerHTML='<div class="modal" data-act="backdrop"><div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>Markdown</h3><span><button class="btn small" data-act="copy-md">복사</button> <button class="btn small ghost" data-act="close-md">닫기</button></span></div><textarea id="mdtext" readonly aria-label="Markdown">'+esc(toMd())+'</textarea></div></div>';
  $("mdtext").select();
}

/* ---------- save (republish this page from state) ---------- */
function buildDoc(){
  var css=document.getElementById("page-css").textContent;
  var js=document.getElementById("page-js").textContent;
  var json=JSON.stringify(S,null,1).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+esc(TITLE)+'</title>'+FONTS+'<style id="page-css">'+css+'</style><div id="app"></div>'+
    '<script type="application/json" id="plan-data">'+json+'<\/script><script id="page-js">'+js+'<\/script></body></html>';
}
async function save(){
  if(!art||!dirty) return;
  if(art.gh&&!ghToken()){showConnect();return;}
  saveState="saving"; renderBar();
  var prevRev=S.meta.rev, prevAt=S.meta.savedAt;
  S.meta.rev=prevRev+1; S.meta.savedAt=new Date().toISOString();
  lsSet(DRAFT_KEY,JSON.stringify({baseRev:prevRev,data:S}));
  pendingBase=prevRev;
  var res;
  try{ res=await art.publish(buildDoc()); }
  catch(err){
    var code=err&&err.code;
    S.meta.rev=prevRev; S.meta.savedAt=prevAt;
    if(code==="conflict"){ if(art.gh){saveState="conflict";renderBar();return;} saveState="ok"; renderBar(); if(art.server) location.reload(); return; }
    if(code==="badtoken"){ saveState="badtoken"; renderBar(); return; }
    if(code==="not_writer"||code==="not_granted"||code==="consent_required"||code==="not_declared"||code==="capability_disabled"||code==="capability_removed"){ saveState="readonly"; renderBar(); return; }
    saveState="error"; renderBar(); return;
  }
  if(res&&res.noReload){ dirty=false; lsDel(DRAFT_KEY); saveState="ok"; renderBar(); }
}

renderAll();
/* outside claude.ai: save through plan_server.py (POST writes the html file) */
var pendingBase=null;
function serverApi(){
  if(!/^https?:$/.test(location.protocol)) return Promise.resolve(null);
  return fetch("__plan_api/ping",{cache:"no-store"}).then(function(r){
    if(!r.ok) return null;
    return {server:true, publish:function(html){
      return fetch("__plan_api/save",{method:"POST",headers:{"Content-Type":"text/html; charset=utf-8","X-Base-Rev":String(pendingBase)},body:html}).then(function(r){
        if(r.status===409) throw {code:"conflict"};
        if(!r.ok) throw {code:"upstream_error"};
        location.reload(); return {version:""};
      },function(){throw {code:"upstream_error"};});
    }};
  },function(){return null;});
}
Promise.resolve(window.claude&&window.claude.use?window.claude.use("artifact"):null).then(function(ns){
  return ns || ghApi() || serverApi();
},function(){return ghApi() || serverApi();}).then(function(ns){
  art=ns;
  if(ns&&ns.gh){
    saveState=ghToken()?"ok":"needtoken"; renderBar();
    ns.pull().then(function(cur){
      var st=stateOf(cur.html);
      if(st&&st.meta.rev>S.meta.rev){S=st; dirty=false; staleDraft=null; checkDraft(); renderAll();}
    },function(){});
    return;
  }
  saveState= ns ? "ok" : "nocap"; renderBar();
});
})();
